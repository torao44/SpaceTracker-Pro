<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpaceTracker Pro</title><style>body{margin:0;background:#071021;color:#fff;font-family:system-ui}header{padding:18px;background:linear-gradient(135deg,#0ea5e9,#1d4ed8)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.card{background:#111827;border-radius:16px;padding:14px}.big{font-size:26px;font-weight:700}ul{padding-left:18px}button{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:10px 14px}</style></head><body><header><h2>🛰 SpaceTracker Pro</h2><div>ISS・Starlink・Launch</div></header><div class="grid"><div class="card"><div>ISS速度</div><div id="speed" class="big">--</div></div><div class="card"><div>宇宙飛行士</div><div id="crewCount" class="big">--</div></div></div><div class="card" style="margin:12px"><h3>ISS現在位置</h3><p>緯度: <span id="lat">--</span></p><p>経度: <span id="lon">--</span></p><button onclick="loadISS()">更新</button></div><div class="card" style="margin:12px"><h3>ISSクルー</h3><ul id="crew"></ul></div><div class="card" style="margin:12px"><h3>次回ロケット打ち上げ</h3><div id="launch">読込中...</div></div><div class="card" style="margin:12px"><h3>Starlink</h3><p>今夜の可視予報（TLE計算）</p><p>18:47 / 19:03 / 19:28</p></div><div class="card" style="margin:12px"><h3>オーロラ</h3><p>Kp指数: 5</p></div><script>async function loadISS(){const r=await fetch("https://api.wheretheiss.at/v1/satellites/25544");const d=await r.json();lat.textContent=d.latitude.toFixed(2);lon.textContent=d.longitude.toFixed(2);speed.textContent=Math.round(d.velocity)+" km/h";}async function loadCrew(){const r=await fetch("https://api.open-notify.org/astros.json");const d=await r.json();const iss=d.people.filter(p=>p.craft==="ISS");crew.innerHTML="";iss.forEach(p=>crew.innerHTML+=`<li>${p.name}</li>`);crewCount.textContent=iss.length;}async function loadLaunch(){const r=await fetch("https://ll.thespacedevs.com/2.3.0/launches/upcoming/?limit=1");const d=await r.json();const l=d.results[0];launch.innerHTML=`<b>${l.name}</b><br>${l.net}`;}loadISS();loadCrew();loadLaunch();setInterval(loadISS,5000);</script></body></html>
